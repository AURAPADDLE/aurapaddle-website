<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AURA PADDLE · Orders</title>
  <style>
    :root{--ink:#102b38;--muted:#657983;--line:#d9e3e6;--paper:#fff;--bg:#f3f7f8;--coral:#f15b45;--green:#185d38}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,sans-serif}header{background:var(--ink);color:#fff;padding:22px 5vw;display:flex;align-items:center;justify-content:space-between;gap:20px}header strong{letter-spacing:2px;font-size:18px}header a{color:#fff}main{max-width:1120px;margin:36px auto;padding:0 24px}.auth,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}.auth{max-width:600px;margin:70px auto}.auth h1{margin-top:0}input,select,button{font:inherit}input[type=password],input[type=number],input[type=text],input[type=url],input[type=date],select{width:100%;padding:12px;border:1px solid #b8c7cc;border-radius:6px;margin:7px 0 13px;background:#fff;color:var(--ink)}button{border:0;border-radius:6px;background:var(--coral);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}button.secondary{background:var(--ink)}button:disabled{cursor:not-allowed;opacity:.55}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.toolbar h1{margin:0}.summary,.muted{color:var(--muted)}.summary.error,.message.error{color:#9a3022}.orders{display:grid;gap:18px}.order{border:1px solid var(--line);border-radius:10px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.order h2{margin:0 0 3px}.status{display:inline-block;padding:5px 9px;border-radius:999px;background:#eaf1f3;font-size:12px}.status.paid{background:#dcf5e7;color:var(--green)}.details{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0}.detail{background:#f4f8f8;border-radius:8px;padding:12px}.detail strong,.detail span{display:block}.items{margin:10px 0 18px;padding-left:20px}.balance-form,.progress-form{border-top:1px solid var(--line);padding-top:18px;margin-top:18px}.checks{display:grid;gap:10px;margin:14px 0}.checks label{display:flex;gap:9px;align-items:flex-start}.total{font-size:17px;font-weight:700;margin:12px 0}.message{margin:12px 0 0}.invoice-link{display:inline-block;margin-top:10px;color:#0b6a86;font-weight:700}.progress-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.current-stage{color:#087e91;font-weight:700}.progress-grid{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-top:14px}.dispatch-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.dispatch-grid label:last-child{grid-column:1/-1}.timeline-mini{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 0;padding:0;list-style:none}.timeline-mini li{padding:5px 8px;border-radius:999px;background:#edf2f3;color:var(--muted);font-size:12px}.timeline-mini li.complete{background:#dcf5e7;color:var(--green)}.timeline-mini li.current{background:#dff6f7;color:#066c78;font-weight:700}.hidden{display:none!important}.empty{text-align:center;padding:50px;color:var(--muted)}@media(max-width:760px){header{align-items:flex-start;flex-direction:column}.toolbar,.order-head,.progress-head{align-items:stretch;flex-direction:column}.details,.progress-grid,.dispatch-grid{grid-template-columns:1fr}.dispatch-grid label:last-child{grid-column:auto}.panel{padding:16px}button{width:100%}}
  </style>
</head>
<body>
  <header><strong>AURA PADDLE</strong><span>Internal orders · <a href="../abandoned-checkouts/">Abandoned checkouts</a></span></header>
  <main>
    <section class="auth" id="auth"><h1>Order operations</h1><p>Enter the existing administrator API token. It remains in this browser tab and is never placed in a URL.</p><label for="token">Administrator token</label><input id="token" type="password" autocomplete="off"><button id="open" type="button">Open orders</button><p id="authStatus" role="status"></p></section>
    <section class="panel hidden" id="panel"><div class="toolbar"><div><h1>Paid orders</h1><div class="summary" id="summary" role="status" aria-live="polite"></div></div><button id="refresh" type="button">Refresh</button></div><div class="orders" id="orders"></div><div class="empty hidden" id="empty">No paid orders have been recorded.</div></section>
  </main>
  <script>
    const $=id=>document.getElementById(id),esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
    const money=(value,currency="AUD")=>new Intl.NumberFormat("en-AU",{style:"currency",currency}).format(Number(value||0)/100),time=value=>value?new Intl.DateTimeFormat("en-AU",{dateStyle:"medium",timeStyle:"short",timeZone:"Australia/Sydney"}).format(new Date(value*1000)):"—",words=value=>String(value||"—").replaceAll("_"," "),currentStage=item=>item.progress?.find(stage=>stage.state==="current")?.label||words(item.fulfilmentStatus);
    function status(message,error=false){const target=$("panel").classList.contains("hidden")?$("authStatus"):$("summary");target.textContent=message;target.classList.toggle("error",error)}
    function parseMoney(value){const clean=String(value||"").trim();if(!/^\d+(\.\d{1,2})?$/.test(clean))return null;const [whole,decimal=""]=clean.split(".");return Number(whole)*100+Number(decimal.padEnd(2,"0"))}
    function dueText(card){const shipping=card.dataset.quoteRequired==="true"?parseMoney(card.querySelector(".shipping-input")?.value):Number(card.dataset.shipping),due=shipping===null?null:Number(card.dataset.balance)+shipping;card.querySelector(".total").textContent=due===null?"Enter the final shipping charge":"Stripe invoice total: "+money(due,card.dataset.currency)}
    function orderCard(item){
      const terminal=["voided"].includes(item.balancePaymentStatus)||["cancelled","refunded","delivered"].includes(item.fulfilmentStatus),alreadyRequested=["requested","payment_failed"].includes(item.balancePaymentStatus),eligible=item.initialPaymentStatus==="paid"&&!terminal&&!alreadyRequested&&item.balancePaymentStatus!=="paid";
      const shipping=item.shippingQuoteRequired?`<label>Final shipping charge (AUD)<input class="shipping-input" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00" required></label>`:`<p><strong>Confirmed shipping:</strong> ${money(item.shippingAmount,item.currency)} · ${esc(item.shippingLabel||"Selected delivery region")}</p>`;
      const balanceAction=eligible?`<div class="balance-form"><strong>Final payment approval</strong><p class="muted">The remaining product balance and final shipping are calculated here. The customer cannot edit either amount.</p>${shipping}<div class="total"></div><div class="checks"><label><input class="ready" type="checkbox"> <span>I confirm the product is ready to proceed to dispatch after final payment.</span></label><label><input class="freight" type="checkbox"> <span>I confirm the delivery region and final shipping charge are correct.</span></label></div><button class="send-balance" type="button">Create &amp; email Stripe invoice</button><p class="message balance-message" role="status"></p></div>`:alreadyRequested?`<div class="balance-form"><strong>Stripe invoice ${item.balancePaymentStatus==="payment_failed"?"requires payment":"sent"}</strong><p>${item.balanceRequestedAmount===null?"":`${money(item.balanceRequestedAmount,item.currency)} · `}${esc(words(item.balancePaymentStatus))}</p>${item.balanceInvoiceUrl?`<a class="invoice-link" href="${esc(item.balanceInvoiceUrl)}" target="_blank" rel="noopener">Open the same customer invoice</a>`:""}</div>`:"";
      const progress=(item.progress||[]).map(stage=>`<li class="${esc(stage.state)}">${esc(stage.label)}</li>`).join(""),dispatchDisabled=item.balancePaymentStatus!=="paid"?"disabled":"";
      const progressForm=terminal?"":`<div class="progress-form"><div class="progress-head"><div><strong>Customer order progress</strong><p class="muted">Updates appear immediately on the secure customer order page. Dispatch also queues a customer email.</p></div><span class="current-stage">Current: ${esc(currentStage(item))}</span></div><ul class="timeline-mini">${progress}</ul><div class="progress-grid"><div><label>Progress action<select class="progress-stage"><option value="update_estimate">Update estimated dispatch only</option><option value="production_confirmed">Production / stock confirmed</option><option value="dispatched" ${dispatchDisabled}>Dispatched</option><option value="delivered" ${item.dispatchedAt?"":"disabled"}>Delivered</option></select></label><label>Estimated dispatch date<input class="estimate" type="date" value="${esc(item.estimatedDispatchDate||"")}"></label></div><div class="dispatch-grid"><label>Carrier<input class="carrier" type="text" maxlength="80" value="${esc(item.carrier||"")}" placeholder="e.g. Mainfreight"></label><label>Tracking number<input class="tracking-number" type="text" maxlength="100" value="${esc(item.trackingNumber||"")}"></label><label>Secure tracking link (optional)<input class="tracking-url" type="url" value="${esc(item.trackingUrl||"")}" placeholder="https://..."></label></div></div>${item.balancePaymentStatus!=="paid"?`<p class="muted">Dispatch becomes available after Stripe confirms the final payment.</p>`:""}<button class="save-progress secondary" type="button">Save customer progress</button><p class="message progress-message" role="status"></p></div>`;
      return `<article class="order" data-order="${esc(item.orderNumber)}" data-balance="${item.remainingProductBalance}" data-shipping="${item.shippingAmount??0}" data-quote-required="${item.shippingQuoteRequired}" data-currency="${esc(item.currency)}"><div class="order-head"><div><h2>${esc(item.orderNumber)}</h2><span class="muted">Received ${time(item.created)}</span></div><span class="status ${item.balancePaymentStatus==="paid"?"paid":""}">${esc(words(item.balancePaymentStatus))}</span></div><div class="details"><div class="detail"><strong>Customer</strong><span>${esc(item.customerName||"Not supplied")}</span><span>${esc(item.customerEmail||"Not supplied")}</span><span>${esc(item.customerPhone||"")}</span></div><div class="detail"><strong>Payments</strong><span>Initial paid: ${money(item.initialPaymentAmount,item.currency)}</span><span>Product balance: ${money(item.remainingProductBalance,item.currency)}</span></div><div class="detail"><strong>Fulfilment</strong><span>${esc(words(item.fulfilmentStatus))}</span><span>${esc(item.shippingLabel||"Shipping not recorded")}</span></div></div><ul class="items">${item.items.map(row=>`<li>${esc(row.name)} × ${row.quantity} <span class="muted">${esc(row.sku)}</span></li>`).join("")}</ul>${balanceAction}${progressForm}</article>`;
    }
    function bindCards(){document.querySelectorAll(".order").forEach(card=>{const input=card.querySelector(".shipping-input"),total=card.querySelector(".total");if(input)input.addEventListener("input",()=>dueText(card));if(total)dueText(card);card.querySelector(".send-balance")?.addEventListener("click",()=>requestBalance(card));card.querySelector(".save-progress")?.addEventListener("click",()=>saveProgress(card))})}
    async function load({manual=false}={}){const token=sessionStorage.getItem("aura_admin_token")||$("token").value.trim();if(!token)return;const button=$("refresh");if(manual){button.disabled=true;button.textContent="Refreshing…"}status("Loading orders…");try{const response=await fetch(`/api/admin/orders?refresh=${Date.now()}`,{headers:{Authorization:`Bearer ${token}`},cache:"no-store"}),data=await response.json();if(!response.ok)throw Object.assign(new Error(data.error||`HTTP ${response.status}`),{status:response.status});sessionStorage.setItem("aura_admin_token",token);$("auth").classList.add("hidden");$("panel").classList.remove("hidden");const items=Array.isArray(data.items)?data.items:[];$("orders").innerHTML=items.map(orderCard).join("");$("empty").classList.toggle("hidden",items.length>0);status(`${items.length} order${items.length===1?"":"s"} · refreshed ${time(data.generatedAt)}`);bindCards()}catch(error){if(error.status===401)sessionStorage.removeItem("aura_admin_token");status(error.status===401?"The administrator token was not accepted. Reload and enter it again.":`Orders could not be loaded: ${error.message}`,true)}finally{if(manual){button.disabled=false;button.textContent="Refresh"}}}
    async function requestBalance(card){const message=card.querySelector(".balance-message"),button=card.querySelector(".send-balance"),productReady=card.querySelector(".ready").checked,finalShippingConfirmed=card.querySelector(".freight").checked,shippingAmount=card.dataset.quoteRequired==="true"?parseMoney(card.querySelector(".shipping-input").value):Number(card.dataset.shipping);message.classList.remove("error");if(!productReady||!finalShippingConfirmed){message.textContent="Complete both confirmations before continuing.";message.classList.add("error");return}if(shippingAmount===null){message.textContent="Enter a valid final shipping charge.";message.classList.add("error");return}const due=Number(card.dataset.balance)+shippingAmount;if(!confirm(`Send the secure Stripe invoice for ${money(due,card.dataset.currency)} to this customer?`))return;button.disabled=true;button.textContent="Creating invoice…";message.textContent="";try{const response=await fetch("/api/admin/request-balance",{method:"POST",headers:{Authorization:`Bearer ${sessionStorage.getItem("aura_admin_token")||""}`,"Content-Type":"application/json"},body:JSON.stringify({orderNumber:card.dataset.order,shippingAmount,productReady:true,finalShippingConfirmed:true})}),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);message.textContent="Stripe invoice sent. The customer can pay from the email or secure order page.";setTimeout(()=>load(),900)}catch(error){message.textContent=`Invoice was not sent: ${error.message}`;message.classList.add("error");button.disabled=false;button.textContent="Create & email Stripe invoice"}}
    async function saveProgress(card){const message=card.querySelector(".progress-message"),button=card.querySelector(".save-progress"),stage=card.querySelector(".progress-stage").value,payload={orderNumber:card.dataset.order,stage,estimatedDispatchDate:card.querySelector(".estimate").value,carrier:card.querySelector(".carrier").value,trackingNumber:card.querySelector(".tracking-number").value,trackingUrl:card.querySelector(".tracking-url").value};message.classList.remove("error");if(["dispatched","delivered"].includes(stage)&&!confirm(`Confirm ${words(stage)} for ${card.dataset.order}? This changes the customer-facing order status${stage==="dispatched"?" and queues a dispatch email":""}.`))return;button.disabled=true;button.textContent="Saving…";try{const response=await fetch("/api/admin/order-progress",{method:"POST",headers:{Authorization:`Bearer ${sessionStorage.getItem("aura_admin_token")||""}`,"Content-Type":"application/json"},body:JSON.stringify(payload)}),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);message.textContent="Customer order progress updated.";setTimeout(()=>load(),700)}catch(error){message.textContent=`Progress was not updated: ${error.message}`;message.classList.add("error");button.disabled=false;button.textContent="Save customer progress"}}
    $("open").addEventListener("click",()=>load());$("refresh").addEventListener("click",()=>load({manual:true}));if(sessionStorage.getItem("aura_admin_token"))load();
  </script>
</body>
</html>
