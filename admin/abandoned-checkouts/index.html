<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
  <title>AURA PADDLE · Abandoned checkouts</title>
  <style>
    :root{--ink:#102b38;--muted:#657983;--line:#d9e3e6;--paper:#fff;--bg:#f3f7f8;--coral:#f15b45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Arial,sans-serif}header{background:var(--ink);color:#fff;padding:22px 5vw;display:flex;align-items:center;justify-content:space-between}header strong{letter-spacing:2px;font-size:18px}main{max-width:1280px;margin:36px auto;padding:0 24px}.auth,.panel{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:24px}.auth{max-width:600px;margin:70px auto}.auth h1{margin-top:0}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #b8c7cc;border-radius:6px;margin:8px 0 14px}button{border:0;border-radius:6px;background:var(--coral);color:#fff;font-weight:700;padding:12px 18px;cursor:pointer}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.toolbar h1{margin:0}.summary{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1050px}th,td{text-align:left;vertical-align:top;padding:12px 10px;border-bottom:1px solid var(--line)}th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}td small{display:block;color:var(--muted)}.status{display:inline-block;padding:4px 8px;border-radius:999px;background:#eaf1f3;font-size:12px}.status.email_sent,.status.recovered{background:#dcf5e7;color:#185d38}.status.email_failed{background:#fde5df;color:#8b2d1d}a{color:#0b6a86}.hidden{display:none!important}.empty{text-align:center;padding:50px;color:var(--muted)}
  </style>
</head>
<body><header><strong>AURA PADDLE</strong><span>Internal checkout recovery</span></header><main>
  <section class="auth" id="auth"><h1>Abandoned checkout list</h1><p>Enter the existing administrator API token. It is kept only in this browser tab and is never placed in a URL.</p><label for="token">Administrator token</label><input id="token" type="password" autocomplete="off"><button id="open" type="button">Open list</button><p id="authStatus" role="status"></p></section>
  <section class="panel hidden" id="panel"><div class="toolbar"><div><h1>Abandoned checkouts</h1><div class="summary" id="summary"></div></div><button id="refresh" type="button">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Expired</th><th>Customer</th><th>Items</th><th>Amount</th><th>Consent</th><th>Email</th><th>Outcome</th><th>Source</th><th>Recovery</th></tr></thead><tbody id="rows"></tbody></table><div class="empty hidden" id="empty">No abandoned checkouts have been recorded.</div></div></section>
  </main><script>
  const $=id=>document.getElementById(id),fmtTime=value=>value?new Intl.DateTimeFormat("en-AU",{dateStyle:"medium",timeStyle:"short",timeZone:"Australia/Sydney"}).format(new Date(value*1000)):"—",esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
  async function load(){const token=sessionStorage.getItem("aura_admin_token")||$("token").value.trim();if(!token)return;$("authStatus").textContent="Loading…";const response=await fetch("/api/admin/abandoned-checkouts",{headers:{Authorization:`Bearer ${token}`}});if(!response.ok){$("authStatus").textContent=response.status===401?"The administrator token was not accepted.":"The list could not be loaded.";return}sessionStorage.setItem("aura_admin_token",token);const data=await response.json(),items=data.items||[];$("auth").classList.add("hidden");$("panel").classList.remove("hidden");$("summary").textContent=`${items.length} recorded · refreshed ${fmtTime(data.generatedAt)}`;$("rows").innerHTML=items.map(item=>`<tr><td>${fmtTime(item.expiredAt)}<small>${esc(item.orderNumber||item.sessionId)}</small></td><td>${esc(item.email||"Not supplied")}</td><td>${item.items.map(x=>`${esc(x.name)} × ${x.quantity}<small>${esc(x.sku)}</small>`).join("")}</td><td>${new Intl.NumberFormat("en-AU",{style:"currency",currency:item.currency}).format(item.amountTotal/100)}</td><td>${item.promotionConsent?"Opted in":"No recovery consent"}</td><td><span class="status ${esc(item.status)}">${esc(item.emailStatus)}</span>${item.emailSentAt?`<small>Sent ${fmtTime(item.emailSentAt)}</small>`:""}</td><td><span class="status ${esc(item.status)}">${esc(item.status)}</span>${item.recoveredAt?`<small>Recovered ${fmtTime(item.recoveredAt)}</small>`:""}</td><td>${esc(item.source||"Direct / unknown")}<small>${esc(item.campaign||"")}</small></td><td>${item.recoveryUrl&&item.promotionConsent&&!item.recoveredAt?`<a href="${esc(item.recoveryUrl)}" target="_blank" rel="noopener">Open Stripe link</a>`:"—"}</td></tr>`).join("");$("empty").classList.toggle("hidden",items.length>0)}
  $("open").addEventListener("click",()=>load().catch(()=>{$("authStatus").textContent="The list could not be loaded."}));$("refresh").addEventListener("click",()=>load());if(sessionStorage.getItem("aura_admin_token"))load();
  </script></body></html>
