<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>AURA PADDLE · Review moderation</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#102b38;font:16px/1.5 Arial,sans-serif}header{padding:22px 5vw;background:#102b38;color:#fff}header a{color:#fff}main{max-width:1000px;margin:32px auto;padding:0 18px}.panel,.card{background:#fff;border:1px solid #d9e3e6;border-radius:12px;padding:22px}.panel{margin-bottom:18px}.card{margin-bottom:16px}.card h2{margin:.35rem 0}.meta{color:#637680;font-size:14px}label{display:block;margin:12px 0}input{width:100%;max-width:520px;padding:12px;border:1px solid #adbec4;border-radius:7px;font:inherit}button{padding:11px 16px;margin:5px 8px 5px 0;border:0;border-radius:7px;background:#102b38;color:#fff;font:700 14px Arial,sans-serif;cursor:pointer}button.publish{background:#087e91}button.reject{background:#9a3b2d}button:disabled{opacity:.5;cursor:not-allowed}blockquote{margin:16px 0;padding:0 0 0 18px;border-left:3px solid #d9e3e6;white-space:pre-wrap;overflow-wrap:anywhere}#message{min-height:1.5em}.hidden{display:none}
</style></head><body><header><strong>AURA PADDLE</strong> · Review moderation · <a href="../orders/">Orders</a></header><main><section class="panel" id="login"><h1>Customer reviews</h1><p>Enter the existing administrator token. Reviews stay private until approved.</p><label for="token">Administrator token</label><input id="token" type="password" autocomplete="off"><button id="open" type="button">Open review queue</button></section><section class="panel hidden" id="queue"><h1>Review queue</h1><p id="message" role="status" aria-live="polite"></p><button id="refresh" type="button">Refresh</button><div id="items"></div></section></main>
<script>
const $=id=>document.getElementById(id),esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]),token=()=>sessionStorage.getItem("aura_admin_token")||$("token").value.trim();
async function load(){if(!token())return;$("message").textContent="Loading…";try{const response=await fetch("/api/admin/reviews",{headers:{Authorization:`Bearer ${token()}`},cache:"no-store"}),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);sessionStorage.setItem("aura_admin_token",token());$("login").classList.add("hidden");$("queue").classList.remove("hidden");const items=data.items||[];$("message").textContent=`${items.filter(item=>item.status==="pending").length} pending · ${items.filter(item=>item.status==="published").length} published · ${items.filter(item=>item.status==="rejected").length} rejected`;$("items").innerHTML=items.length?items.map(item=>`<article class="card" data-id="${esc(item.id)}"><div class="meta">${esc(item.slug)} · ${esc(item.sku)} · ${esc(item.status)} · ${esc(item.createdAt)}</div><h2>${esc(item.title)}</h2><strong>${esc(item.rating)} / 5 stars · ${esc(item.name)}</strong><div class="meta">${esc(item.email||"Legacy published review")}</div><blockquote>${esc(item.body)}</blockquote><button class="publish" data-status="published" ${item.status==="published"?"disabled":""}>Publish</button><button class="reject" data-status="rejected" ${item.status==="rejected"?"disabled":""}>Reject / unpublish</button></article>`).join(""):"<p>No reviews yet.</p>"}catch(error){$("message").textContent=`Could not load reviews: ${error.message}`}}
$("open").addEventListener("click",load);$("refresh").addEventListener("click",load);$("items").addEventListener("click",async event=>{const button=event.target.closest("button[data-status]");if(!button)return;const card=button.closest("[data-id]"),status=button.dataset.status;if(!confirm(`${status==="published"?"Publish":"Reject / unpublish"} this review?`))return;button.disabled=true;try{const response=await fetch("/api/admin/reviews",{method:"POST",headers:{Authorization:`Bearer ${token()}` ,"Content-Type":"application/json"},body:JSON.stringify({id:card.dataset.id,status})}),data=await response.json();if(!response.ok)throw new Error(data.error||`HTTP ${response.status}`);await load()}catch(error){$("message").textContent=`Could not update review: ${error.message}`;button.disabled=false}});if(sessionStorage.getItem("aura_admin_token"))load();
</script></body></html>
