<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Order status | AURA PADDLE</title><link rel="stylesheet" href="../stripe-checkout.css"><link rel="stylesheet" href="../cookie-consent.css"></head><body><main class="checkout-shell"><section class="checkout-card"><div class="brand">AURA PADDLE</div><p class="eyebrow">Order tracking</p><h1 id="heading">Check your order.</h1><p id="statusCopy">Use the secure tracking link in your payment confirmation.</p><div class="order-summary" id="orderSummary" hidden><strong id="orderNumber"></strong><span id="paymentStatus"></span><span id="balanceStatus"></span><span id="fulfilmentStatus"></span><span id="dispatchEstimate"></span></div><div class="balance-payment" id="balancePayment" hidden><strong>Your final payment is ready.</strong><p>The same secure Stripe invoice is available from your email and here on your order page.</p><a class="btn btn-coral" id="balancePaymentLink" href="#" rel="noopener">Pay remaining balance securely</a></div><div class="actions"><a class="btn btn-primary" href="../shop/">Return to shop</a><a class="btn btn-secondary" href="mailto:admin@aurapaddle.com">Contact order support</a></div></section></main><script>
(async()=>{const params=new URLSearchParams(location.search),order=params.get("order"),token=params.get("token");if(!order||!token)return;try{const response=await fetch(`/api/order?order=${encodeURIComponent(order)}&token=${encodeURIComponent(token)}`),data=await response.json();if(!response.ok)throw new Error(data.error||"Unable to retrieve this order.");document.getElementById("heading").textContent=`Order ${data.orderNumber}`;document.getElementById("statusCopy").textContent="This status is updated from verified Stripe payments and AURA PADDLE fulfilment records.";document.getElementById("orderNumber").textContent=`${data.orderNumber} · ${data.quantity} item${data.quantity===1?"":"s"}`;document.getElementById("paymentStatus").textContent=`Initial payment: ${String(data.initialPaymentStatus||"pending").replaceAll("_"," ")}`;document.getElementById("balanceStatus").textContent=`Remaining balance: ${String(data.balancePaymentStatus||"not requested").replaceAll("_"," ")}`;document.getElementById("fulfilmentStatus").textContent=`Order status: ${String(data.fulfilmentStatus||data.orderStatus).replaceAll("_"," ")}`;document.getElementById("dispatchEstimate").textContent=data.dispatchedAt?`Dispatched ${new Date(data.dispatchedAt).toLocaleDateString("en-AU")} · allow up to four weeks for delivery depending on destination and carrier`:`Estimated dispatch follows the product page and order updates.`;document.getElementById("orderSummary").hidden=false;if(data.balancePaymentUrl){document.getElementById("balancePaymentLink").href=data.balancePaymentUrl;document.getElementById("balancePayment").hidden=false}}catch(error){document.getElementById("statusCopy").textContent=error.message}})();
</script><script src="../cookie-consent.js"></script></body></html>
