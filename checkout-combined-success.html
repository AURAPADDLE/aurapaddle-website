<!doctype html>
<html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>Payment confirmation | AURA PADDLE</title><link rel="stylesheet" href="stripe-checkout.css"><style>.group-list{display:grid;gap:.75rem;margin:1.2rem 0}.group{border:1px solid #dfe7ea;border-radius:.75rem;padding:1rem}.group strong,.group span{display:block}.group span{margin-top:.35rem;color:#52636d;font-size:.9rem;line-height:1.5}@media(max-width:430px){.checkout-card{padding:1.25rem}.actions{display:grid}.actions .btn{width:100%;box-sizing:border-box;text-align:center}}</style></head>
<body><main class="checkout-shell"><section class="checkout-card"><div class="brand">AURA PADDLE</div><p class="eyebrow">Secure payment confirmation</p><h1 id="title">Checking your payment.</h1><p id="status" aria-live="polite">We are securely checking Stripe and the AURA order record. This page does not mark an order paid.</p><div id="summary" hidden><div class="order-summary"><strong id="orderNumber"></strong><span id="today"></span></div><div class="group-list" id="groups"></div></div><p id="next">You can safely refresh this page while payment confirmation is pending.</p><div class="actions"><a class="btn btn-primary" href="cart/">Return to cart</a><a class="btn btn-secondary" href="shop/">Continue shopping</a></div></section></main><script src="coastgo-offer.js?v=20260929-launch"></script><script src="cart.js"></script><script>
(()=>{
  const money=value=>`AUD $${(Number(value||0)/100).toFixed(2)}`,params=new URLSearchParams(location.search),id=params.get("session_id"),cancelled=params.get("cancelled")==="1",title=document.getElementById("title"),statusCopy=document.getElementById("status"),summary=document.getElementById("summary"),groups=document.getElementById("groups"),next=document.getElementById("next");
  const render=record=>{document.getElementById("orderNumber").textContent=`Order ${record.orderNumber}`;document.getElementById("today").textContent=`${money(record.amountToday)} ${record.status==="paid"?"paid":"due"} in the original checkout`;groups.replaceChildren(...record.groups.map(group=>{const card=document.createElement("section");card.className="group";const heading=document.createElement("strong"),detail=document.createElement("span"),balance=document.createElement("span");heading.textContent=group.kind==="stock"?"In-stock items":"Pre-order items";detail.textContent=`${group.items.map(item=>`${item.sku} × ${item.quantity}`).join(", ")} · ${money(group.productDueToday)} product${group.shippingDueToday?` + ${money(group.shippingDueToday)} shipping`:""}`;balance.textContent=group.paymentStatus==="paid_in_full"?"Current status: paid in full.":group.balanceRequestedAmount?`Current amount requested before dispatch: ${money(group.balanceRequestedAmount)}.`:group.remainingProductBalance?`${money(group.remainingProductBalance)} product balance remains; confirmed pre-order shipping is due before dispatch.`:"Paid in full with this payment.";card.append(heading,detail,balance);return card}));summary.hidden=false};
  const check=async(attempt=0)=>{if(!id){title.textContent=cancelled?"Checkout cancelled.":"Checkout reference missing.";statusCopy.textContent=cancelled?"No payment confirmation was recorded by this page. Your cart remains available.":"Return to your cart and start secure checkout again.";next.textContent="No order or fulfilment change was made from this page.";return}try{const response=await fetch(`/api/combined-checkout-session?id=${encodeURIComponent(id)}`,{headers:{Accept:"application/json"}}),record=await response.json();if(!response.ok)throw Error(record.error||"Unable to verify this checkout.");render(record);if(record.status==="paid"){title.textContent="Payment received.";statusCopy.textContent=`Stripe and AURA confirm ${money(record.amountPaid)} paid in the original checkout.`;next.textContent=record.groups.some(group=>group.paymentStatus!=="paid_in_full")?"In-stock items can proceed independently. Any amount shown as outstanding remains payable before that pre-order group dispatches.":"All product groups are currently paid in full. Fulfilment continues separately for each group.";const consumedKey=`aura-combined-cart-consumed-v1:${record.orderNumber}`;if(localStorage.getItem(consumedKey)!=="1"){window.AURACart?.consume(record.groups.flatMap(group=>group.items));localStorage.setItem(consumedKey,"1")}return}if(record.status==="confirming"){title.textContent="Payment is being confirmed.";statusCopy.textContent="Stripe reports the payment as paid. AURA is waiting for the signed payment notification before updating fulfilment.";if(attempt<10)return setTimeout(()=>check(attempt+1),1500)}else if(record.status==="expired"){title.textContent="Checkout expired.";statusCopy.textContent="This Checkout Session expired without a confirmed payment. Your cart remains available."}else{title.textContent="Payment not completed.";statusCopy.textContent="Stripe has not confirmed payment. Your cart remains available and no fulfilment was started."}next.textContent="If you believe payment completed, do not pay again; contact AURA PADDLE with the order reference."}catch(error){title.textContent="We could not confirm this payment.";statusCopy.textContent=error.message;next.textContent="Do not submit another payment until AURA PADDLE confirms the status."}};check();
})();
</script></body></html>
